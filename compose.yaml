name: rag-ley21719
services:
  api:
    build:
      context: .
      dockerfile: etapa3_producto/Dockerfile
    restart: unless-stopped
    environment:
      RAG_MODE: ${RAG_MODE:-demo}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.6-27b}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      RAG_BACKEND_FACTORY: ${RAG_BACKEND_FACTORY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      MISTRAL_EMBED_MODEL: ${MISTRAL_EMBED_MODEL:-mistral-embed}
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}@db:5432/ley21719
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
  frontend:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./etapa3_producto/frontend:/usr/share/nginx/html:ro
      - ./etapa3_producto/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ley21719
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./etapa2_rag/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ley21719"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
